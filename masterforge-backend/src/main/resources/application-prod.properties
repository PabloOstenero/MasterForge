# Production profile — activated with --spring.profiles.active=prod
# All secrets MUST be supplied via environment variables; never hardcode them here.

# ===============================
# POSTGRESQL CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Use 'jackson' instead of the ObjectMapper class name to avoid ClassCastException
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# ===============================
# SERVER PORT
# ===============================
server.port=8080

# ===============================
# JWT CONFIGURATION
# ===============================
mf.jwt.secret=${JWT_SECRET}

# ===============================
# CACHE CONFIGURATION
# ===============================
spring.cache.type=simple

# ===============================
# STRUCTURED LOGGING
# ===============================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.root=WARN
logging.level.com.masterforge=INFO
logging.level.org.springframework.web=WARN
# Silence request-logging filter in production (it is enabled for dev/staging only)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN

# ===============================
# ERROR RESPONSE SECURITY
# ===============================
server.error.include-message=never
server.error.include-stacktrace=never

# ===============================
# DISCORD OAUTH2 CONFIGURATION
# ===============================
discord.client.id=${DISCORD_CLIENT_ID}
discord.client.secret=${DISCORD_CLIENT_SECRET}
discord.redirect.uri=${DISCORD_REDIRECT_URI}
