name: MasterForge Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-tests:
    name: Backend Tests (Kotlin / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterforge-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Backend Tests
        run: ./gradlew test

  frontend-tests:
    name: Frontend Tests (Angular / Jasmine / Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterforge-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: masterforge-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
