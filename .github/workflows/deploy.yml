name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'masterforge-frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'masterforge-frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd masterforge-frontend
          npm ci

      - name: Build Application
        run: |
          cd masterforge-frontend
          npm run build

      - name: Add 404 and .nojekyll Fallbacks
        run: |
          # Copy index.html to 404.html to support Angular's SPA deep routing on refresh
          cp masterforge-frontend/www/index.html masterforge-frontend/www/404.html
          # Add .nojekyll to prevent GitHub Pages from ignoring folders starting with underscores
          touch masterforge-frontend/www/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: masterforge-frontend/www
          branch: gh-pages
