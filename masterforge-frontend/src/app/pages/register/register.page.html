<ion-content class="register-content">
  <div class="register-wrapper">
    <!-- Header with Icon and Title -->
    <div class="auth-header">
      <div class="header-icon-wrapper">
        <ion-icon name="create-outline" class="header-icon"></ion-icon>
      </div>
      <h1 class="auth-title">MasterForge</h1>
      <p class="auth-subtitle">Crea tu cuenta de aventurero</p>
    </div>

    <!-- Main Card -->
    <ion-card class="register-card">
      <ion-card-content class="form-container">
        <!-- Name Input -->
        <div class="form-group">
          <ion-input
            label="Nombre"
            labelPlacement="floating"
            [(ngModel)]="name"
            [disabled]="isLoading"
            data-testid="name-input">
          </ion-input>
        </div>

        <!-- Email Input -->
        <div class="form-group">
          <ion-input
            label="Correo electrónico"
            labelPlacement="floating"
            type="email"
            [(ngModel)]="email"
            [disabled]="isLoading"
            autocomplete="email"
            data-testid="email-input">
          </ion-input>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <ion-input
            label="Contraseña"
            labelPlacement="floating"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            [disabled]="isLoading"
            autocomplete="new-password"
            data-testid="password-input">
            <ion-button slot="end" fill="clear" class="toggle-btn" (click)="showPassword = !showPassword" [disabled]="isLoading">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-input>
        </div>

        <!-- Confirm Password Input -->
        <div class="form-group">
          <ion-input
            label="Confirmar contraseña"
            labelPlacement="floating"
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            [disabled]="isLoading"
            autocomplete="new-password"
            data-testid="confirm-password-input">
            <ion-button slot="end" fill="clear" class="toggle-btn" (click)="showConfirmPassword = !showConfirmPassword" [disabled]="isLoading">
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-input>
        </div>

        <!-- Error Message -->
        @if (errorMessage) {
          <div class="error-banner" data-testid="error-message">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <p>{{ errorMessage }}</p>
          </div>
        }

        <!-- Submit Button -->
        <ion-button
          expand="block"
          class="btn-gold btn-register"
          [disabled]="isLoading"
          (click)="onSubmit()"
          data-testid="submit-button">
          @if (isLoading) {
            <ion-spinner slot="start"></ion-spinner>
            Registrando...
          } @else {
            Crear Cuenta
          }
        </ion-button>

        <!-- Navigation Link -->
        <div class="auth-footer">
          <p class="auth-link">¿Ya tienes cuenta? 
            <span class="link-text" (click)="router.navigate(['/login'])">Inicia sesión aquí</span>
          </p>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
