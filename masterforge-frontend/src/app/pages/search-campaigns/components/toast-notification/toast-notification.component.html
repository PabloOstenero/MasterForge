@if (activeToast) {
  <div
    class="toast-container"
    [class]="'toast-container toast-' + activeToast.type"
    data-testid="toast-container"
    role="alert"
    aria-live="polite"
  >
    <span class="toast-message" data-testid="toast-message">{{ activeToast.message }}</span>
    <button
      class="toast-dismiss-btn"
      data-testid="toast-dismiss-btn"
      (click)="onDismiss()"
      aria-label="Cerrar notificación"
      type="button"
    >
      ×
    </button>
  </div>
}
