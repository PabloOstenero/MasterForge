<div class="layout-wrapper">

  <!-- Mobile sidebar backdrop -->
  @if (isSidebarOpen) {
    <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }

  <nav class="sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-top">
      <span class="sidebar-title">MasterForge</span>
    </div>

    <ul class="nav-list">
      @for (item of menuItems$ | async; track item.route) {
        <li>
          <a [routerLink]="item.route" routerLinkActive="active" class="nav-item">
            <ion-icon [name]="item.icon"></ion-icon>
            <span>{{ item.title }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="sidebar-footer">
      <button class="role-toggle-sidebar" (click)="toggleRole()" type="button">
        <ion-icon name="swap-horizontal-outline"></ion-icon>
        <span>{{ (activeRole$ | async) === 'dm' ? 'Modo Jugador' : 'Modo Director' }}</span>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <!-- Hamburger: only visible on mobile -->
        <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Abrir menú" type="button">
          <ion-icon name="menu-outline"></ion-icon>
        </button>
        <div class="topbar-title">
          <ion-icon [name]="pageIcon" class="page-icon"></ion-icon>
          <span>{{ pageTitle }}</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="notification-btn" [class.has-unread]="((unreadCount$ | async) || 0) > 0" (click)="toggleNotifications($event)" aria-label="Notificaciones" type="button">
          <ion-icon [name]="((unreadCount$ | async) || 0) > 0 ? 'notifications' : 'notifications-outline'" class="action-icon"></ion-icon>
          @if (((unreadCount$ | async) || 0) > 0) {
            <span class="notification-badge">{{ unreadCount$ | async }}</span>
          }
        </button>
        <button class="avatar-btn" (click)="openDropdown()" aria-label="Menú de usuario" type="button">
          <ion-icon name="person-circle-outline" class="avatar-icon"></ion-icon>
        </button>
      </div>
      @if (isDropdownOpen) {
        <div class="dropdown-overlay" (click)="closeDropdown()"></div>
        <div class="dropdown-menu">
          <div class="dropdown-user-header">
            <span class="user-welcome">Hola,</span>
            <strong class="user-name">{{ username }}</strong>
          </div>
          <button class="dropdown-item" type="button" (click)="navigateToSettings()">
            <ion-icon name="settings-outline"></ion-icon>
            <span>Configuración</span>
          </button>
          <button class="dropdown-item danger" type="button" (click)="logout()">
            <ion-icon name="log-out-outline"></ion-icon>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      }
    </div>
    <div class="page-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
